name: Bug report
description: Something in Glyph Gestures does not work as it should.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. Have an idea instead of a bug? Please use [Discussions, Ideas](https://github.com/moorle-dev/glyph-gestures-feedback/discussions/categories/ideas).
  - type: input
    id: package-version
    attributes:
      label: Glyph Gestures version
      description: Window > Package Manager > Glyph Gestures, for example 1.0.0.
    validations:
      required: true
  - type: input
    id: unity-version
    attributes:
      label: Unity version
      description: Help > About Unity, for example 6000.0.76f1.
    validations:
      required: true
  - type: dropdown
    id: render-pipeline
    attributes:
      label: Render pipeline
      description: The render pipeline is the part of Unity that draws your game. Pick Not sure if you do not know.
      options:
        - Built-in
        - URP
        - HDRP
        - Not sure
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
        - Other
    validations:
      required: true
  - type: dropdown
    id: input-device
    attributes:
      label: Input device
      options:
        - Mouse
        - Touch screen
        - Pen
        - Controller or hand tracking
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: A screenshot or short clip helps. Drag it into this box.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: If you can, paste the text from Copy diagnostics
      description: In the Glyph Studio window, choose ⋮ > Copy diagnostics at the top right. It puts details about your project on the clipboard. They help find the cause, and they hold no names or file paths.
      render: text
    validations:
      required: false
